# Temporary diagnostic: name-entry timing, 1.0.2 (works on device) vs 2.0, Release + real ads.
name: Hang compare

"on":
  push:
    branches: [hang-compare]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: names ${{ matrix.ref }} ${{ matrix.names }}
    runs-on: macos-15-intel
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        ref: [v1.0.2-rating, v2.0]
        names: [cjk, ascii]
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: src
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Generate
        working-directory: src
        run: cp ../tools/hangcmp/NameHangUITests.swift UITests/ && xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name or "Plus" in name or "Max" in name: continue
                  score = (ver, "Pro" not in name, name)
                  if best is None or score > best[0]: best = (score, d["udid"], name, runtime)
          print(best[1]); print(f"Using {best[2]} on {best[3]}", file=sys.stderr)
          ')
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
      - name: Run NameHangUITests (Release, real ads)
        working-directory: src
        env:
          TEST_RUNNER_NAME_SET: ${{ matrix.names }}
        run: |
          set +e
          xcodebuild test \
            -project Big2.xcodeproj -scheme Big2 -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData -resultBundlePath Hang.xcresult \
            -only-testing:Big2UITests/NameHangUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > test.log 2>&1
          status=$?
          grep -E "Test Case|error:|STEP|\*\* TEST" test.log | tail -120
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hangcmp-${{ matrix.ref }}-${{ matrix.names }}
          path: src/test.log
          if-no-files-found: ignore
