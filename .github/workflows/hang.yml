# Temporary (branch v2.0-hang only): reproduce build 79 freeze (round 2 入分 / skin switch).
name: Hang repro
"on":
  push:
    branches: [v2.0-hang]
permissions:
  contents: read
jobs:
  repro:
    name: ${{ matrix.scheme }} Release ads=${{ matrix.ads }}
    strategy:
      fail-fast: false
      matrix:
        scheme: [Big2, DaLaoEr]
        ads: [real, stub]
    runs-on: macos-15-intel
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name or "Plus" in name or "Max" in name: continue
                  score = (ver, "Pro" not in name, name)
                  if best is None or score > best[0]: best = (score, d["udid"], name, runtime)
          print(best[1]); print(f"Using {best[2]} on {best[3]}", file=sys.stderr)
          ')
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
      - name: Build for testing (Release)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Big2.xcodeproj -scheme ${{ matrix.scheme }} -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build.log 2>&1 || { tail -80 build.log; exit 1; }
      - name: Run hang UI tests with sampler
        env:
          TEST_RUNNER_HANG_TEST_REAL_ADS: ${{ matrix.ads == 'real' && '1' || '0' }}
        run: |
          set +e
          if [ "${{ matrix.scheme }}" = "Big2" ]; then T=Big2UITests; P=Big2; else T=DaLaoErUITests; P=DaLaoEr; fi
          mkdir -p samples
          (
            while true; do
              pid=$(pgrep -f "/${P}.app/${P}$" | head -1)
              if [ -n "$pid" ]; then
                sample "$pid" 1 -mayDie -file "samples/s-$(date +%H%M%S).txt" >/dev/null 2>&1
              fi
              sleep 2
            done
          ) &
          SAMPLER=$!
          xcodebuild test-without-building \
            -project Big2.xcodeproj -scheme ${{ matrix.scheme }} -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData -resultBundlePath Hang.xcresult \
            -only-testing:${T}/HangUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > test.log 2>&1
          status=$?
          kill $SAMPLER
          grep -E "Test Case|error:|failed|UI hang|s  (tap|probe|focus|type)|\*\* TEST" test.log | tail -200
          ls samples | wc -l
          exit $status
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/*Big2* ~/Library/Logs/DiagnosticReports/*DaLaoEr* crashes/ 2>/dev/null || true
          ls -la crashes
          xcrun xcresulttool export attachments --path Hang.xcresult --output-path attachments || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-${{ matrix.scheme }}-${{ matrix.ads }}
          path: |
            test.log
            samples
            crashes
            attachments
          if-no-files-found: ignore
