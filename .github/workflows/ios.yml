# iOS CI: simulator build + tests on every push/PR.
# TestFlight archive + upload on workflow_dispatch or tags matching v*.
# Job B skips cleanly (does not fail) when App Store Connect secrets are missing.

name: iOS

"on":
  # Docs-only changes do not need a macOS build (billed 10x on a private repo).
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (Simulator) & Test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iOS Simulator (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Big2.xcodeproj \
            -scheme Big2 \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run AppCore tests
        run: swift test --package-path .

      - name: Run ScoringEngine tests
        run: swift test --package-path Packages/ScoringEngine

  testflight:
    name: Archive & Upload to TestFlight
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check App Store Connect secrets
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${ASC_KEY_ID}" ]; then missing+=("ASC_KEY_ID"); fi
          if [ -z "${ASC_ISSUER_ID}" ]; then missing+=("ASC_ISSUER_ID"); fi
          if [ -z "${ASC_KEY_P8}" ]; then missing+=("ASC_KEY_P8"); fi
          if [ -z "${APPLE_TEAM_ID}" ]; then missing+=("APPLE_TEAM_ID"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping TestFlight upload. Missing secrets: ${missing[*]}"
            echo "仲未設定齊 App Store Connect secrets，今次跳過上傳，唔算失敗。等 Apple Developer 帳戶開好再加。"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "Secrets present. Continuing with archive and TestFlight upload."
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        if: steps.check.outputs.skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        if: steps.check.outputs.skip != 'true'
        run: xcodebuild -version

      - name: Install XcodeGen
        if: steps.check.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check.outputs.skip != 'true'
        run: xcodegen generate

      - name: Write App Store Connect API key
        if: steps.check.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="${RUNNER_TEMP}/private_keys"
          mkdir -p "${KEY_DIR}" "${HOME}/.appstoreconnect/private_keys"
          KEY_PATH="${KEY_DIR}/AuthKey_${ASC_KEY_ID}.p8"
          export KEY_PATH
          python3 - <<'PY'
          import base64, os, pathlib, sys
          raw = os.environ["ASC_KEY_P8"].strip()
          if "BEGIN" in raw:
              pem = raw if raw.endswith("\n") else raw + "\n"
          else:
              cleaned = "".join(raw.split())
              try:
                  pem = base64.b64decode(cleaned).decode("utf-8")
              except Exception as exc:
                  sys.exit(f"ASC_KEY_P8 is not valid PEM or base64: {exc}")
              if not pem.endswith("\n"):
                  pem += "\n"
          path = pathlib.Path(os.environ["KEY_PATH"])
          path.write_text(pem)
          path.chmod(0o600)
          if "BEGIN" not in path.read_text():
              sys.exit("ASC_KEY_P8 did not decode to a PEM private key. Check the secret.")
          print("API key written.")
          PY
          cp "${KEY_PATH}" "${HOME}/.appstoreconnect/private_keys/"
          echo "ASC_AUTH_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Write ExportOptions.plist
        if: steps.check.outputs.skip != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive for App Store
        if: steps.check.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Big2.xcodeproj \
            -scheme Big2 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${RUNNER_TEMP}/Big2.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload archive to TestFlight
        if: steps.check.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/Big2.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -destination upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"; then
            echo "Uploaded to App Store Connect with xcodebuild -exportArchive -destination upload."
            exit 0
          fi

          echo "exportArchive destination upload failed; falling back to export + altool."
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          text = path.read_text()
          text = text.replace("<string>upload</string>", "<string>export</string>")
          path.write_text(text)
          print("ExportOptions destination set to export.")
          PY
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/Big2.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          IPA=$(ls "${RUNNER_TEMP}/export"/*.ipa)
          echo "Uploading ${IPA} with altool."
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"
