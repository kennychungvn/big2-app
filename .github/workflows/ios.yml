# iOS CI: simulator build + tests on every push/PR.
# TestFlight archive + upload on workflow_dispatch or tags matching v*, for both apps:
# Big2 (鋤大D計分, com.kenny.daidee) and DaLaoEr (大老二計分, com.kenny.dalaoer).
# Job B skips cleanly (does not fail) when App Store Connect secrets are missing.

name: iOS

"on":
  # Docs-only changes do not need a macOS build (billed 10x on a private repo).
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      apps:
        description: "Which app(s) to archive and upload to TestFlight"
        type: choice
        options: [both, hk, tw]
        default: both

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (Simulator) & Test
    # macos-latest (arm64) jobs sat unacquired for 15+ min on 2026-11-12; Intel picks them up.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iOS Simulator (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Big2.xcodeproj \
            -scheme Big2 \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check privacy manifests (source + built app)
        run: |
          set -euo pipefail
          python3 scripts/check_privacy_manifests.py App/PrivacyInfo.xcprivacy
          APP=DerivedData/Build/Products/Debug-iphonesimulator/Big2.app
          echo "Every PrivacyInfo.xcprivacy in the simulator build:"
          find "${APP}" -name PrivacyInfo.xcprivacy -print
          python3 scripts/check_privacy_manifests.py "${APP}"

      - name: Run AppCore tests
        run: swift test --package-path .

      - name: Run ScoringEngine tests
        run: swift test --package-path Packages/ScoringEngine

  # Taiwan-only app (scheme DaLaoEr). Build + privacy check only.
  # No TestFlight upload: Kenny must create the App Store Connect app record first.
  build-and-test-taiwan:
    name: Build DaLaoEr (Simulator)
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build DaLaoEr for iOS Simulator (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Big2.xcodeproj \
            -scheme DaLaoEr \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData-DaLaoEr \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check privacy manifests (DaLaoEr)
        run: |
          set -euo pipefail
          python3 scripts/check_privacy_manifests.py App/PrivacyInfo.xcprivacy
          APP=DerivedData-DaLaoEr/Build/Products/Debug-iphonesimulator/DaLaoEr.app
          echo "Every PrivacyInfo.xcprivacy in the DaLaoEr simulator build:"
          find "${APP}" -name PrivacyInfo.xcprivacy -print
          python3 scripts/check_privacy_manifests.py "${APP}"

  testflight:
    name: Archive & Upload to TestFlight (${{ matrix.scheme }})
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # macos-latest (arm64) jobs sat unacquired for 15+ min on 2026-11-12; Intel picks them up.
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each scheme is its own App Store Connect app record; automatic (cloud-managed)
        # signing with the same API key covers both bundle ids.
        include:
          - scheme: Big2
            app: hk
            bundle_id: com.kenny.daidee
          - scheme: DaLaoEr
            app: tw
            bundle_id: com.kenny.dalaoer
    steps:
      - name: Check App Store Connect secrets
        id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${ASC_KEY_ID}" ]; then missing+=("ASC_KEY_ID"); fi
          if [ -z "${ASC_ISSUER_ID}" ]; then missing+=("ASC_ISSUER_ID"); fi
          if [ -z "${ASC_KEY_P8}" ]; then missing+=("ASC_KEY_P8"); fi
          if [ -z "${APPLE_TEAM_ID}" ]; then missing+=("APPLE_TEAM_ID"); fi
          SELECTED="${{ github.event.inputs.apps || 'both' }}"
          if [ "${SELECTED}" != "both" ] && [ "${SELECTED}" != "${{ matrix.app }}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping ${{ matrix.scheme }}: this run uploads only '${SELECTED}'."
            exit 0
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping TestFlight upload. Missing secrets: ${missing[*]}"
            echo "仲未設定齊 App Store Connect secrets，今次跳過上傳，唔算失敗。等 Apple Developer 帳戶開好再加。"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "Secrets present. Continuing with archive and TestFlight upload."
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        if: steps.check.outputs.skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        if: steps.check.outputs.skip != 'true'
        run: xcodebuild -version

      - name: Install XcodeGen
        if: steps.check.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check.outputs.skip != 'true'
        run: xcodegen generate

      - name: Write App Store Connect API key
        if: steps.check.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_DIR="${RUNNER_TEMP}/private_keys"
          mkdir -p "${KEY_DIR}" "${HOME}/.appstoreconnect/private_keys"
          KEY_PATH="${KEY_DIR}/AuthKey_${ASC_KEY_ID}.p8"
          export KEY_PATH
          python3 - <<'PY'
          import base64, os, pathlib, sys
          raw = os.environ["ASC_KEY_P8"].strip()
          if "BEGIN" in raw:
              pem = raw if raw.endswith("\n") else raw + "\n"
          else:
              cleaned = "".join(raw.split())
              try:
                  pem = base64.b64decode(cleaned).decode("utf-8")
              except Exception as exc:
                  sys.exit(f"ASC_KEY_P8 is not valid PEM or base64: {exc}")
              if not pem.endswith("\n"):
                  pem += "\n"
          path = pathlib.Path(os.environ["KEY_PATH"])
          path.write_text(pem)
          path.chmod(0o600)
          if "BEGIN" not in path.read_text():
              sys.exit("ASC_KEY_P8 did not decode to a PEM private key. Check the secret.")
          print("API key written.")
          PY
          cp "${KEY_PATH}" "${HOME}/.appstoreconnect/private_keys/"
          echo "ASC_AUTH_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Write ExportOptions.plist
        if: steps.check.outputs.skip != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Archive for App Store
        if: steps.check.outputs.skip != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Automatic signing at archive time requests an iOS Development
          # profile, which Apple will not issue until the team has at least
          # one registered device. Archive unsigned instead; the export step
          # signs with a cloud-managed Apple Distribution certificate (App
          # Store profiles do not need a device). That cloud signing requires
          # an Admin App Store Connect API key; App Manager is not enough.
          xcodebuild archive \
            -project Big2.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${RUNNER_TEMP}/${{ matrix.scheme }}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Re-sign nested frameworks ad hoc
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # The archive is unsigned, but SPM binary xcframeworks (GoogleMobileAds,
          # UserMessagingPlatform) arrive carrying Google's signature, which the
          # thinning copy invalidates. Export then re-signs them while keeping the
          # stale designated requirement, and App Store validation rejects them
          # ("not properly signed"). Sign every nested binary ad hoc, inside-out,
          # so export replaces a clean signature with the Apple Distribution one.
          APP="${RUNNER_TEMP}/${{ matrix.scheme }}.xcarchive/Products/Applications/${{ matrix.scheme }}.app"
          if [ -d "${APP}/Frameworks" ]; then
            find "${APP}/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' item; do
                echo "Ad hoc signing ${item#${APP}/} (was: $(codesign -dvv "${item}" 2>&1 | grep -m1 -E '^Authority=|not signed' || echo 'unknown'))"
                codesign --force --sign - --timestamp=none "${item}"
              done
          fi

      - name: Export signed IPA (cloud-managed signing)
        if: steps.check.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +e
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/${{ matrix.scheme }}.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" 2>&1 | tee "${RUNNER_TEMP}/export.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            if grep -Eiq 'Cloud signing permission|cloud-managed distribution certificates' "${RUNNER_TEMP}/export.log"; then
              echo "::error::The App Store Connect API key cannot use cloud-managed distribution certificates. It needs Admin access."
            fi
            echo "::error::xcodebuild -exportArchive failed (exit ${status})."
            exit 1
          fi

      - name: Check IPA bundle id
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IPA=$(ls "${RUNNER_TEMP}/export"/*.ipa)
          ID=$(unzip -p "${IPA}" 'Payload/*.app/Info.plist' | plutil -extract CFBundleIdentifier raw -o - -)
          echo "IPA bundle id: ${ID}"
          if [ "${ID}" != "${{ matrix.bundle_id }}" ]; then
            echo "::error::Expected ${{ matrix.bundle_id }}, got ${ID}."
            exit 1
          fi

      - name: Verify IPA signatures
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          IPA=$(ls "${RUNNER_TEMP}/export"/*.ipa)
          CHECK_DIR="${RUNNER_TEMP}/ipa-check"
          rm -rf "${CHECK_DIR}" && mkdir -p "${CHECK_DIR}"
          unzip -q "${IPA}" -d "${CHECK_DIR}"
          APP=$(ls -d "${CHECK_DIR}"/Payload/*.app)
          fail=0
          check() {
            local item="$1" info
            if ! codesign --verify --strict --verbose=2 "${item}"; then
              echo "::error::Signature does not verify: ${item#${CHECK_DIR}/}"
              fail=1; return
            fi
            info=$(codesign -dvv "${item}" 2>&1 || true)
            if ! grep -q '^Authority=Apple Distribution' <<<"${info}"; then
              echo "::error::Not signed with an Apple Distribution certificate: ${item#${CHECK_DIR}/}"
              grep -E '^(Authority|TeamIdentifier|Signature)=' <<<"${info}" || true
              fail=1; return
            fi
            echo "OK  ${item#${CHECK_DIR}/}"
          }
          if [ -d "${APP}/Frameworks" ]; then
            while IFS= read -r -d '' item; do check "${item}"; done < <(
              find "${APP}/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0)
          fi
          check "${APP}"
          if [ "${fail}" -ne 0 ]; then
            echo "::error::IPA is not fully distribution-signed; refusing to upload."
            exit 1
          fi

      - name: Check privacy manifests in IPA
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # ITMS-91064 is reported by path; list and validate every manifest that ships,
          # and make sure the bundle-root one is our App/PrivacyInfo.xcprivacy.
          CHECK_DIR="${RUNNER_TEMP}/ipa-check"
          APP=$(ls -d "${CHECK_DIR}"/Payload/*.app)
          echo "Every PrivacyInfo.xcprivacy in ${APP#${CHECK_DIR}/}:"
          find "${APP}" -name PrivacyInfo.xcprivacy -print | sed "s|^${APP}/|  |"
          python3 scripts/check_privacy_manifests.py "${APP}"
          ROOT="${APP}/PrivacyInfo.xcprivacy"
          if [ ! -f "${ROOT}" ]; then
            echo "::error::No PrivacyInfo.xcprivacy at the app bundle root."
            exit 1
          fi
          python3 - "${ROOT}" App/PrivacyInfo.xcprivacy <<'PY'
          import plistlib, sys
          a, b = (plistlib.load(open(p, "rb")) for p in sys.argv[1:3])
          if a != b:
              sys.exit("::error::Bundle-root PrivacyInfo.xcprivacy is not App/PrivacyInfo.xcprivacy.")
          print("Bundle-root PrivacyInfo.xcprivacy matches App/PrivacyInfo.xcprivacy.")
          PY
          echo "Privacy manifest check passed."

      - name: Upload IPA to TestFlight
        if: steps.check.outputs.skip != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "${RUNNER_TEMP}/export"/*.ipa)
          echo "Uploading ${IPA##*/} (${{ matrix.bundle_id }}, build ${{ github.run_number }})."
          # altool can exit 0 even when the upload fails, so check its output too.
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA}" \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}" 2>&1 | tee "${RUNNER_TEMP}/altool.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ] \
            || grep -Eq 'UPLOAD FAILED|Failed to upload package|ERROR:' "${RUNNER_TEMP}/altool.log" \
            || ! grep -Eq 'UPLOAD SUCCEEDED|No errors uploading' "${RUNNER_TEMP}/altool.log"; then
            echo "::error::TestFlight upload failed (altool exit ${status}). See the log above."
            exit 1
          fi
          echo "${{ matrix.scheme }} build ${{ github.run_number }} uploaded to App Store Connect."
