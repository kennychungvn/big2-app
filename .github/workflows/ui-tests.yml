# Real UI run on an iPhone simulator: XCUITest full flow (HK + TW), screenshots exported
# from the .xcresult and uploaded as the "ui-screenshots" artifact.
name: UI Tests

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: XCUITest (Simulator)
    # macos-latest (arm64) jobs sat unacquired for 15+ min on 2026-11-12; Intel picks them up.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name or "Plus" in name or "Max" in name:
                      continue
                  score = (ver, "Pro" not in name, name)
                  if best is None or score > best[0]:
                      best = (score, d["udid"], name, runtime)
          if best is None:
              sys.exit("no iPhone simulator")
          print(best[1])
          print(f"Using {best[2]} on {best[3]}", file=sys.stderr)
          ')
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b

      - name: App Store style status bar
        run: |
          xcrun simctl status_bar booted override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Run UI tests (Hong Kong, blocking)
        run: |
          set +e
          xcodebuild test \
            -project Big2.xcodeproj \
            -scheme Big2 \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath UITestResults.xcresult \
            -skip-testing:Big2UITests/Big2UITests/testTaiwanFlowFlagForcedOn \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > xcodebuild-test.log 2>&1
          status=$?
          grep -E "Test Case|error:|failed|\*\* TEST" xcodebuild-test.log | tail -200
          exit $status

      # Taiwan is on hold (FeatureFlags.taiwanEnabledByDefault = false). This run forces the
      # flag on with -enableTaiwan and never fails the workflow.
      - name: Run UI tests (Taiwan flag forced on, non-blocking)
        if: always()
        continue-on-error: true
        run: |
          set +e
          xcodebuild test-without-building \
            -project Big2.xcodeproj \
            -scheme Big2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath UITestResults-TW.xcresult \
            -only-testing:Big2UITests/Big2UITests/testTaiwanFlowFlagForcedOn \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > xcodebuild-test-tw.log 2>&1
          status=$?
          grep -E "Test Case|error:|failed|\*\* TEST" xcodebuild-test-tw.log | tail -100
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          set -uo pipefail
          mkdir -p screenshots
          for bundle in UITestResults.xcresult UITestResults-TW.xcresult; do
            [ -d "$bundle" ] || continue
            raw="raw-${bundle%.xcresult}"
            if xcrun xcresulttool export attachments --path "$bundle" --output-path "$raw"; then
              RAW="$raw" python3 - <<'PY'
          import json, os, pathlib, re, shutil
          raw = pathlib.Path(os.environ["RAW"])
          out = pathlib.Path("screenshots")
          manifest = json.loads((raw / "manifest.json").read_text())
          for test in manifest:
              for att in test.get("attachments", []):
                  src = raw / att["exportedFileName"]
                  name = att.get("suggestedHumanReadableName") or att["exportedFileName"]
                  stem = name.split("_")[0]  # "HK-01-home-fresh_0_<uuid>.png" -> "HK-01-home-fresh"
                  # Keep only our named screenshots (skip crash logs, debug descriptions,
                  # synthesized-event images, screen recordings: odd names break upload).
                  if src.suffix.lower() not in (".png", ".jpg", ".jpeg") or not re.fullmatch(r"(HK|TW)[-A-Za-z0-9]+", stem):
                      continue
                  dest = out / (stem + src.suffix)
                  shutil.copy(src, dest)
                  print(dest)
          PY
            else
              brew list xcparse >/dev/null 2>&1 || brew install chargepoint/xcparse/xcparse
              xcparse screenshots "$bundle" screenshots
            fi
          done
          ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          if-no-files-found: warn

      - name: Upload test log and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            xcodebuild-test*.log
            UITestResults*.xcresult
          if-no-files-found: ignore
