# Real UI run on an iPhone simulator: XCUITest full flow (HK + TW), screenshots exported
# from the .xcresult and uploaded as the "ui-screenshots" artifact.
name: UI Tests

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: XCUITest (Simulator)
    # macos-latest (arm64) jobs sat unacquired for 15+ min on 2026-11-12; Intel picks them up.
    runs-on: macos-15-intel
    # 120: 7150f91's HK suite ran ~78 min of xcodebuild and the 90 min cap
    # cancelled the job just after the screenshot upload.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name or "Plus" in name or "Max" in name:
                      continue
                  score = (ver, "Pro" not in name, name)
                  if best is None or score > best[0]:
                      best = (score, d["udid"], name, runtime)
          if best is None:
              sys.exit("no iPhone simulator")
          print(best[1])
          print(f"Using {best[2]} on {best[3]}", file=sys.stderr)
          ')
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b

      - name: App Store style status bar
        run: |
          xcrun simctl status_bar booted override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Run UI tests (Hong Kong, blocking)
        run: |
          set +e
          xcodebuild test \
            -project Big2.xcodeproj \
            -scheme Big2 \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath UITestResults.xcresult \
            -skip-testing:Big2UITests/Big2UITests/testTaiwanFlowFlagForcedOn \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > xcodebuild-test.log 2>&1
          status=$?
          grep -E "Test Case|error:|failed|\*\* TEST" xcodebuild-test.log | tail -200
          exit $status

      # Taiwan is on hold (FeatureFlags.taiwanEnabledByDefault = false). This run forces the
      # flag on with -enableTaiwan and never fails the workflow.
      - name: Run UI tests (Taiwan flag forced on, non-blocking)
        if: always()
        continue-on-error: true
        run: |
          set +e
          xcodebuild test-without-building \
            -project Big2.xcodeproj \
            -scheme Big2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath UITestResults-TW.xcresult \
            -only-testing:Big2UITests/Big2UITests/testTaiwanFlowFlagForcedOn \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > xcodebuild-test-tw.log 2>&1
          status=$?
          grep -E "Test Case|error:|failed|\*\* TEST" xcodebuild-test-tw.log | tail -100
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          set -uo pipefail
          mkdir -p screenshots
          for bundle in UITestResults.xcresult UITestResults-TW.xcresult; do
            [ -d "$bundle" ] || continue
            raw="raw-${bundle%.xcresult}"
            if xcrun xcresulttool export attachments --path "$bundle" --output-path "$raw"; then
              RAW="$raw" python3 - <<'PY'
          import json, os, pathlib, re, shutil
          raw = pathlib.Path(os.environ["RAW"])
          out = pathlib.Path("screenshots")
          manifest = json.loads((raw / "manifest.json").read_text())
          for test in manifest:
              for att in test.get("attachments", []):
                  src = raw / att["exportedFileName"]
                  name = att.get("suggestedHumanReadableName") or att["exportedFileName"]
                  stem = name.split("_")[0]  # "HK-01-home-fresh_0_<uuid>.png" -> "HK-01-home-fresh"
                  # Keep only our named screenshots (skip crash logs, debug descriptions,
                  # synthesized-event images, screen recordings: odd names break upload).
                  if src.suffix.lower() not in (".png", ".jpg", ".jpeg") or not re.fullmatch(r"(HK|TW|DLE)[-A-Za-z0-9]+", stem):
                      continue
                  dest = out / (stem + src.suffix)
                  shutil.copy(src, dest)
                  print(dest)
          PY
            else
              brew list xcparse >/dev/null 2>&1 || brew install chargepoint/xcparse/xcparse
              xcparse screenshots "$bundle" screenshots
            fi
          done
          ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          if-no-files-found: warn

      - name: Upload test log and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            xcodebuild-test*.log
            UITestResults*.xcresult
          if-no-files-found: ignore

  # Taiwan-only app screenshots (setup / entry / settlement). Separate job so the
  # existing HK UI-test job is unchanged. No TestFlight.
  ui-tests-taiwan:
    name: XCUITest DaLaoEr (Simulator)
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name or "Plus" in name or "Max" in name:
                      continue
                  score = (ver, "Pro" not in name, name)
                  if best is None or score > best[0]:
                      best = (score, d["udid"], name, runtime)
          if best is None:
              sys.exit("no iPhone simulator")
          print(best[1])
          print(f"Using {best[2]} on {best[3]}", file=sys.stderr)
          ')
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b

      - name: App Store style status bar
        run: |
          xcrun simctl status_bar booted override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          # System dark mode on: the skins must ignore it (經典 dark, Ledger stays light).
          xcrun simctl ui booted appearance dark || true

      - name: Run DaLaoEr UI tests
        run: |
          set +e
          xcodebuild test \
            -project Big2.xcodeproj \
            -scheme DaLaoEr \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData-DaLaoEr \
            -resultBundlePath UITestResults-DaLaoEr.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > xcodebuild-test-dalaoer.log 2>&1
          status=$?
          grep -E "Test Case|error:|failed|\*\* TEST" xcodebuild-test-dalaoer.log | tail -200
          exit $status

      - name: Export screenshots
        if: always()
        run: |
          set -uo pipefail
          mkdir -p screenshots
          bundle=UITestResults-DaLaoEr.xcresult
          [ -d "$bundle" ] || exit 0
          raw="raw-DaLaoEr"
          if xcrun xcresulttool export attachments --path "$bundle" --output-path "$raw"; then
            RAW="$raw" python3 - <<'PY'
          import json, os, pathlib, re, shutil
          raw = pathlib.Path(os.environ["RAW"])
          out = pathlib.Path("screenshots")
          manifest = json.loads((raw / "manifest.json").read_text())
          for test in manifest:
              for att in test.get("attachments", []):
                  src = raw / att["exportedFileName"]
                  name = att.get("suggestedHumanReadableName") or att["exportedFileName"]
                  stem = name.split("_")[0]
                  if src.suffix.lower() not in (".png", ".jpg", ".jpeg") or not re.fullmatch(r"DLE[-A-Za-z0-9]+", stem):
                      continue
                  dest = out / (stem + src.suffix)
                  shutil.copy(src, dest)
                  print(dest)
          PY
          else
            brew list xcparse >/dev/null 2>&1 || brew install chargepoint/xcparse/xcparse
            xcparse screenshots "$bundle" screenshots
          fi
          ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-taiwan
          path: screenshots
          if-no-files-found: warn

      - name: Upload test log and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-taiwan
          path: |
            xcodebuild-test-dalaoer.log
            UITestResults-DaLaoEr.xcresult
          if-no-files-found: ignore

  # Build 79 hang: Release build with the real Google Mobile Ads SDK and official demo
  # ad units (network on), like TestFlight. Plays 5 rounds and switches skins, failing
  # on any step > 8 s. Production units are never requested.
  #
  # Runs on Apple-silicon runners: on the Intel simulator the 8 s limit is dominated by
  # simulator/XCUITest latency, not the app. Baseline (hang-compare run 44793545208, same
  # Intel setup): 1.0.2 build 63, which is fine on device, took 8.4 s to focus the first name
  # field and 32.8 s to focus the second. The test and its 8 s limit are unchanged.
  hang-demo-ads:
    name: Hang test demo ads ${{ matrix.scheme }} (Release)
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scheme: [Big2, DaLaoEr]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name or "Plus" in name or "Max" in name: continue
                  score = (ver, "Pro" not in name, name)
                  if best is None or score > best[0]: best = (score, d["udid"], name, runtime)
          print(best[1]); print(f"Using {best[2]} on {best[3]}", file=sys.stderr)
          ')
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
      - name: Run HangUITests (Release, SDK demo ads)
        env:
          TEST_RUNNER_HANG_TEST_SDK_ADS: "1"
        run: |
          set +e
          if [ "${{ matrix.scheme }}" = "Big2" ]; then T=Big2UITests; else T=DaLaoErUITests; fi
          xcodebuild test \
            -project Big2.xcodeproj -scheme ${{ matrix.scheme }} -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData -resultBundlePath Hang.xcresult \
            -only-testing:${T}/HangUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > test.log 2>&1
          status=$?
          grep -E "Test Case|error:|failed|UI hang|s  (tap|probe|focus|type)|\*\* TEST|HANG_DETECTOR|HangDetector|SHEET_BANNER|Sheet banner" test.log | tail -240
          exit $status
      - name: Export filled-banner screenshot
        if: always()
        run: |
          set -uo pipefail
          mkdir -p hang-attachments
          if [ -d Hang.xcresult ]; then
            if xcrun xcresulttool export attachments --path Hang.xcresult --output-path hang-raw; then
              python3 - <<'PY'
          import json, pathlib, shutil
          raw = pathlib.Path("hang-raw")
          out = pathlib.Path("hang-attachments")
          manifest_path = raw / "manifest.json"
          if not manifest_path.exists():
              raise SystemExit(0)
          manifest = json.loads(manifest_path.read_text())
          for test in manifest:
              for att in test.get("attachments", []):
                  src = raw / att["exportedFileName"]
                  name = att.get("suggestedHumanReadableName") or att["exportedFileName"]
                  hay = f"{name} {att['exportedFileName']}"
                  if src.suffix.lower() not in (".png", ".jpg", ".jpeg"):
                      continue
                  if "sheet-live-banner" not in hay:
                      continue
                  dest = out / ("sheet-live-banner" + src.suffix)
                  shutil.copy(src, dest)
                  print(dest)
          PY
            fi
          fi
          ls -la hang-attachments || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-demo-ads-${{ matrix.scheme }}
          path: |
            test.log
            Hang.xcresult
            hang-attachments
          if-no-files-found: ignore
