name: Big2
options:
  bundleIdPrefix: com.kenny
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant-HK
  xcodeVersion: "15.0"
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
packages:
  AppCore:
    path: .
targets:
  Big2:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - Store/Products.storekit
      - path: App/Store/Products.storekit
        buildPhase: none
        type: file
    # No `info:` block: XcodeGen would regenerate App/Info.plist from it and drop
    # UILaunchScreen / CFBundleDisplayName etc. (the app then ran letterboxed at 320×480).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny.daidee
        PRODUCT_NAME: Big2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - package: AppCore
        product: AppCore
  Big2UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenny.daidee.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Big2
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Big2
schemes:
  Big2:
    build:
      targets:
        Big2: all
    run:
      config: Debug
      storeKitConfiguration: App/Store/Products.storekit
    test:
      config: Debug
      targets:
        - Big2UITests
    archive:
      config: Release
